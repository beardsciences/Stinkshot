# Runs the checks from scripts/check.ps1 on every push to main. GitHub is a mirror of
# https://code.mccullough.dev/christian/stinkshot: never commit there, push to Forgejo.
# Tests that need a real desktop session are marked #[ignore] and only run locally
# (scripts\check.ps1 -Desktop).

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Forgejo Actions also reads .github/workflows; this keeps the job on GitHub only.
    if: github.server_url == 'https://github.com' && github.repository == 'beardsciences/stinkshot'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: pwsh
        run: |
          # Use the version in Cargo.toml (rust-version), the one the code is developed on.
          # Newer clippy releases add lints, which would fail this job for no code change.
          $m = [regex]::Match((Get-Content -Raw Cargo.toml), '(?m)^rust-version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw 'rust-version not found in Cargo.toml' }
          $v = $m.Groups[1].Value
          rustup toolchain install $v --profile minimal --component rustfmt,clippy --no-self-update
          rustup default $v
          rustc --version

      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1 -NoAudit

  # Keeps the code building on the next platforms (docs/notes/cross-platform.md). The
  # portable crates are tested for real. The platform-specific ones only have stand-ins
  # off Windows so far, so the workspace is type-checked there, and the app only has to
  # start (smoke test), not capture.
  portable:
    if: github.server_url == 'https://github.com' && github.repository == 'beardsciences/stinkshot'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo 'rust-version not found in Cargo.toml'; exit 1; }
          rustup toolchain install "$v" --profile minimal --component clippy --no-self-update
          rustup default "$v"
          rustc --version

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Last line: the smoke test's X server, software Vulkan (lavapipe) and a font.
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev \
            xvfb xauth libvulkan1 mesa-vulkan-drivers fonts-dejavu-core libxkbcommon-x11-0

      - name: Test the portable crates and the platform contract
        run: cargo test --locked -p stinkshot-core -p stinkshot-stitch -p stinkshot-history -p stinkshot-logo -p stinkshot-platform -p stinkshot-record

      - name: Check the workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Starts the app (temporary profile, wgpu, Settings window), paints a few frames and
      # exits 0; non-zero with a message on failure or after 20 s (crates/app/src/shell/smoke.rs).
      - name: Build the app
        run: cargo build --locked -p stinkshot

      - name: Smoke test (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          # lavapipe: the runner has no GPU.
          WGPU_BACKEND: vulkan
          RUST_BACKTRACE: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' target/debug/stinkshot --smoke-test

      # macOS runners have a logged-in window server and a paravirtual Metal device, so this
      # should work, but it has not run yet: not required until it has passed once.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 5
        env:
          RUST_BACKTRACE: '1'
        run: target/debug/stinkshot --smoke-test
