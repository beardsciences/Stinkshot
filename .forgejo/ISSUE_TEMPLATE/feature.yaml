name: Feature Request
about: Something Stinkshot should do.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Stinkshot never uploads anything. Requests for upload targets, accounts or telemetry will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where it gets stuck.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How it could work. Optional.
